server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # hashed filenames (Vite build output) — safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # entry point must always be revalidated so it picks up new asset hashes
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
